<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b16">
  <title>Login — Yekah Tool Pro</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #060812;
      --card: rgba(13, 18, 35, 0.88);
      --border: rgba(0, 229, 255, 0.22);
      --cyan: #00e5ff;
      --purple: #9b5cff;
      --pink: #ff3cac;
      --text: #f4f7ff;
      --muted: #8e9ab5;
      --danger: #ff5577;
      --success: #35e39b;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(0, 229, 255, 0.10), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(155, 92, 255, 0.12), transparent 32%),
        linear-gradient(135deg, #04050b, #090d1b 50%, #050711);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: -1;
    }

    body::before {
      background: rgba(0, 229, 255, 0.08);
      top: -100px;
      left: -100px;
    }

    body::after {
      background: rgba(255, 60, 172, 0.08);
      bottom: -100px;
      right: -100px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
      box-shadow:
        0 0 25px rgba(0, 229, 255, 0.35),
        0 0 45px rgba(155, 92, 255, 0.18);
    }

    .brand h1 {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .brand h1 span {
      color: var(--cyan);
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.45);
    }

    .brand p {
      color: var(--muted);
      margin-top: 7px;
      font-size: 13px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 30px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.45),
        inset 0 0 35px rgba(0, 229, 255, 0.025);
    }

    .card-header {
      margin-bottom: 24px;
    }

    .card-header h2 {
      font-size: 23px;
      margin-bottom: 7px;
    }

    .card-header p {
      color: var(--muted);
      font-size: 13px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #dce5ff;
    }

    .input-box {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border-radius: 13px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      outline: none;
      color: #fff;
      background: rgba(4, 7, 17, 0.75);
      transition: 0.25s ease;
      font-size: 14px;
    }

    input:focus {
      border-color: rgba(0, 229, 255, 0.65);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.07);
    }

    input::placeholder {
      color: #58627b;
    }

    .password-input {
      padding-right: 52px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 14px;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #8c98b3;
      cursor: pointer;
      font-size: 17px;
      padding: 5px;
    }

    .toggle-password:hover {
      color: var(--cyan);
    }

    .form-options {
      display: flex;
      justify-content: flex-end;
      margin-top: -5px;
      margin-bottom: 20px;
    }

    .forgot {
      color: var(--cyan);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .forgot:hover {
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    .login-btn {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      color: #041017;
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(100deg, var(--cyan), #65f5ff);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.18);
      transition: 0.25s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 32px rgba(0, 229, 255, 0.35);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffb3c2;
      background: rgba(255, 85, 119, 0.09);
      border: 1px solid rgba(255, 85, 119, 0.22);
    }

    .message.success {
      color: #a8ffd9;
      background: rgba(53, 227, 155, 0.08);
      border: 1px solid rgba(53, 227, 155, 0.22);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: #566078;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
    }

    .register-link {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .register-link a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 800;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .security-note {
      margin-top: 20px;
      text-align: center;
      color: #65708a;
      font-size: 11px;
      line-height: 1.6;
    }

    .back-home {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #74809b;
      text-decoration: none;
      font-size: 12px;
    }

    .back-home:hover {
      color: var(--cyan);
    }

    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(4, 16, 23, 0.3);
      border-top-color: #041017;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -3px;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 23px 18px;
        border-radius: 20px;
      }

      .brand h1 {
        font-size: 24px;
      }

      .logo {
        width: 64px;
        height: 64px;
      }
    }
  </style></head><body>  <main class="login-wrapper"><div class="brand">
  <div class="logo">YT</div>
  <h1>Yekah <span>Tool Pro</span></h1>
  <p>Professional Mobile Servicing & Repair Suite</p>
</div>

<section class="card">

  <div class="card-header">
    <h2>Welcome Back</h2>
    <p>Sign in to access your Yekah Tool Pro account.</p>
  </div>

  <div id="message" class="message"></div>

  <form id="loginForm">

    <div class="form-group">
      <label for="email">Email Address</label>
      <div class="input-box">
        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="Enter your email"
          required
        >
      </div>
    </div>

    <div class="form-group">
      <label for="password">Password</label>

      <div class="input-box">
        <input
          id="password"
          class="password-input"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
          required
        >

        <button
          type="button"
          class="toggle-password"
          id="togglePassword"
          aria-label="Show password"
        >👁</button>
      </div>
    </div>

    <div class="form-options">
      <a href="forgot-password.html" class="forgot">
        Forgot Password?
      </a>
    </div>

    <button type="submit" class="login-btn" id="loginBtn">
      Sign In
    </button>

  </form>

  <div class="divider">Account</div>

  <div class="register-link">
    Don't have an account?
    <a href="register.html">Create Account</a>
  </div>

  <div class="security-note">
    🔐 Your account is protected by secure authentication.
  </div>

</section>

<a href="index.html" class="back-home">
  ← Back to Yekah Tool Pro
</a>

  </main>  <script type="module">
    import { supabase } from "./supabase.js";

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");
    const togglePassword = document.getElementById("togglePassword");
    const message = document.getElementById("message");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    function clearMessage() {
      message.textContent = "";
      message.className = "message";
    }

    function getFriendlyError(error) {
      const msg = (error?.message || "").toLowerCase();

      if (
        msg.includes("invalid login credentials") ||
        msg.includes("invalid credentials")
      ) {
        return "Incorrect email or password. Please check your details and try again.";
      }

      if (msg.includes("email not confirmed")) {
        return "Your email has not been confirmed yet. Please check your email inbox.";
      }

      if (
        msg.includes("rate limit") ||
        msg.includes("too many requests")
      ) {
        return "Too many login attempts. Please wait a few minutes and try again.";
      }

      if (
        msg.includes("network") ||
        msg.includes("fetch") ||
        msg.includes("failed to fetch")
      ) {
        return "Network connection problem. Please check your internet connection.";
      }

      return error?.message || "Unable to sign in. Please try again.";
    }

    async function routeUser(user) {
      const { data: profile, error } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .maybeSingle();

      if (error) {
        throw new Error(
          "Unable to load your account profile. Please try again."
        );
      }

      if (!profile) {
        await supabase.auth.signOut();
        throw new Error(
          "Your account profile was not found. Please contact Yekah Tech support."
        );
      }

      if (
        profile.account_status &&
        profile.account_status !== "active"
      ) {
        await supabase.auth.signOut();

        if (profile.account_status === "suspended") {
          throw new Error(
            "Your account has been suspended. Please contact Yekah Tech support."
          );
        }

        throw new Error(
          "Your account is currently disabled. Please contact Yekah Tech support."
        );
      }

      if (profile.role === "admin") {
        window.location.replace("admin.html");
      } else {
        window.location.replace("dashboard.html");
      }
    }

    togglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";

      passwordInput.type = isPassword ? "text" : "password";

      togglePassword.textContent = isPassword ? "🙈" : "👁";
      togglePassword.setAttribute(
        "aria-label",
        isPassword ? "Hide password" : "Show password"
      );
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      clearMessage();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Please enter your email and password.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerHTML =
        '<span class="spinner"></span>Signing In...';

      try {
        const { data, error } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });

        if (error) {
          throw error;
        }

        if (!data?.user) {
          throw new Error("Login failed. Please try again.");
        }

        showMessage("Login successful. Opening your account...", "success");

        await routeUser(data.user);

      } catch (error) {
        console.error("Login error:", error);

        showMessage(getFriendlyError(error));

        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";
      }
    });

    // If a user is already logged in, route them automatically.
    async function checkExistingSession() {
      try {
        const {
          data: { session }
        } = await supabase.auth.getSession();

        if (session?.user) {
          await routeUser(session.user);
        }
      } catch (error) {
        console.error("Session check error:", error);
      }
    }

    checkExistingSession();
  </script></body>
          </html>
