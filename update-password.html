<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060812">
  <title>Update Password — Yekah Tool Pro</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #060812;
      --card: rgba(13, 18, 35, 0.9);
      --border: rgba(0, 229, 255, 0.22);
      --cyan: #00e5ff;
      --purple: #9b5cff;
      --pink: #ff3cac;
      --text: #f4f7ff;
      --muted: #8e9ab5;
      --danger: #ff5577;
      --success: #35e39b;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(0, 229, 255, .10), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(155, 92, 255, .12), transparent 32%),
        linear-gradient(135deg, #04050b, #090d1b 50%, #050711);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wrapper {
      width: 100%;
      max-width: 440px;
    }

    .brand {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 27px;
      background: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
      box-shadow: 0 0 35px rgba(0, 229, 255, .25);
    }

    .brand h1 {
      font-size: 26px;
    }

    .brand h1 span {
      color: var(--cyan);
    }

    .brand p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 7px;
    }

    .card {
      padding: 30px;
      border-radius: 24px;
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(18px);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
    }

    h2 {
      font-size: 23px;
      margin-bottom: 8px;
    }

    .intro {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 52px 0 15px;
      border-radius: 13px;
      border: 1px solid rgba(255,255,255,.09);
      outline: none;
      background: rgba(4,7,17,.75);
      color: white;
      font-size: 14px;
      transition: .25s;
    }

    input:focus {
      border-color: rgba(0,229,255,.65);
      box-shadow: 0 0 0 3px rgba(0,229,255,.07);
    }

    input::placeholder {
      color: #58627b;
    }

    .toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #8995ae;
      cursor: pointer;
      width: 34px;
      height: 34px;
      font-size: 17px;
    }

    .toggle:hover {
      color: var(--cyan);
    }

    .password-strength {
      margin-top: 9px;
      height: 4px;
      border-radius: 10px;
      background: rgba(255,255,255,.08);
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0;
      transition: .25s;
      border-radius: 10px;
    }

    .strength-text {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .message {
      display: none;
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: #ffb3c2;
      background: rgba(255,85,119,.09);
      border: 1px solid rgba(255,85,119,.22);
    }

    .message.success {
      color: #a8ffd9;
      background: rgba(53,227,155,.08);
      border: 1px solid rgba(53,227,155,.22);
    }

    .update-btn {
      width: 100%;
      height: 53px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      color: #041017;
      background: linear-gradient(100deg, var(--cyan), #65f5ff);
      box-shadow: 0 0 25px rgba(0,229,255,.18);
      transition: .25s;
    }

    .update-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 32px rgba(0,229,255,.35);
    }

    .update-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .links {
      margin-top: 22px;
      text-align: center;
      font-size: 13px;
    }

    .links a {
      color: var(--cyan);
      text-decoration: none;
      font-weight: 700;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .security-note {
      margin-top: 20px;
      text-align: center;
      color: #68738c;
      font-size: 11px;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(4,16,23,.3);
      border-top-color: #041017;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -3px;
      margin-right: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media(max-width:480px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 23px 18px;
        border-radius: 20px;
      }

      .brand h1 {
        font-size: 24px;
      }
    }
  </style></head><body>  <main class="wrapper"><div class="brand">
  <div class="logo">YT</div>

  <h1>
    Yekah <span>Tool Pro</span>
  </h1>

  <p>
    Professional Mobile Servicing & Repair Suite
  </p>
</div>


<section class="card">

  <h2>Set New Password</h2>

  <p class="intro">
    Create a strong new password for your Yekah Tool Pro
    account.
  </p>

  <div id="message" class="message"></div>


  <form id="updateForm">

    <div class="form-group">

      <label for="password">
        New Password
      </label>

      <div class="input-wrap">

        <input
          id="password"
          type="password"
          autocomplete="new-password"
          placeholder="Enter your new password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="toggle"
          id="togglePassword"
          aria-label="Show password"
        >
          👁
        </button>

      </div>

      <div class="password-strength">
        <div
          class="strength-bar"
          id="strengthBar"
        ></div>
      </div>

      <div
        class="strength-text"
        id="strengthText"
      >
        Use at least 6 characters.
      </div>

    </div>


    <div class="form-group">

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <div class="input-wrap">

        <input
          id="confirmPassword"
          type="password"
          autocomplete="new-password"
          placeholder="Confirm your new password"
          minlength="6"
          required
        >

        <button
          type="button"
          class="toggle"
          id="toggleConfirm"
          aria-label="Show password"
        >
          👁
        </button>

      </div>

    </div>


    <button
      type="submit"
      class="update-btn"
      id="updateBtn"
    >
      Update Password
    </button>

  </form>


  <div class="links">
    <a href="login.html">← Back to Login</a>
  </div>


  <div class="security-note">
    🔐 Your new password is securely stored by Supabase
    Authentication.
  </div>

</section>

  </main>  <script type="module">

    import { supabase } from "./supabase.js";


    const updateForm =
      document.getElementById("updateForm");

    const passwordInput =
      document.getElementById("password");

    const confirmInput =
      document.getElementById("confirmPassword");

    const updateBtn =
      document.getElementById("updateBtn");

    const message =
      document.getElementById("message");

    const togglePassword =
      document.getElementById("togglePassword");

    const toggleConfirm =
      document.getElementById("toggleConfirm");

    const strengthBar =
      document.getElementById("strengthBar");

    const strengthText =
      document.getElementById("strengthText");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message show " + type;

    }


    function getPasswordStrength(password) {

      let score = 0;

      if (password.length >= 6) score++;

      if (password.length >= 10) score++;

      if (/[A-Z]/.test(password)) score++;

      if (/[0-9]/.test(password)) score++;

      if (/[^A-Za-z0-9]/.test(password)) score++;

      return score;

    }


    function updateStrength() {

      const password =
        passwordInput.value;

      const score =
        getPasswordStrength(password);


      const percentage =
        Math.min(score * 20, 100);

      strengthBar.style.width =
        percentage + "%";


      if (!password) {

        strengthText.textContent =
          "Use at least 6 characters.";

        strengthBar.style.width = "0%";

      } else if (score <= 1) {

        strengthText.textContent =
          "Weak password.";

      } else if (score <= 3) {

        strengthText.textContent =
          "Medium password.";

      } else {

        strengthText.textContent =
          "Strong password.";

      }

    }


    passwordInput.addEventListener(
      "input",
      updateStrength
    );


    togglePassword.addEventListener(
      "click",
      () => {

        const visible =
          passwordInput.type === "text";

        passwordInput.type =
          visible ? "password" : "text";

        togglePassword.textContent =
          visible ? "👁" : "🙈";

      }
    );


    toggleConfirm.addEventListener(
      "click",
      () => {

        const visible =
          confirmInput.type === "text";

        confirmInput.type =
          visible ? "password" : "text";

        toggleConfirm.textContent =
          visible ? "👁" : "🙈";

      }
    );


    function getFriendlyError(error) {

      const msg =
        (error?.message || "").toLowerCase();


      if (
        msg.includes("same password")
      ) {
        return "Your new password must be different from the old password.";
      }


      if (
        msg.includes("password") &&
        msg.includes("weak")
      ) {
        return "Please choose a stronger password.";
      }


      if (
        msg.includes("session") ||
        msg.includes("auth session")
      ) {
        return "This password reset link has expired or is no longer valid. Please request a new reset link.";
      }


      if (
        msg.includes("network") ||
        msg.includes("fetch") ||
        msg.includes("failed to fetch")
      ) {
        return "Network connection problem. Please check your internet connection.";
      }


      return (
        error?.message ||
        "Unable to update your password."
      );

    }


    updateForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        message.className = "message";
        message.textContent = "";


        const password =
          passwordInput.value;

        const confirmPassword =
          confirmInput.value;


        if (password.length < 6) {

          showMessage(
            "Password must contain at least 6 characters.",
            "error"
          );

          return;

        }


        if (password !== confirmPassword) {

          showMessage(
            "Passwords do not match.",
            "error"
          );

          return;

        }


        updateBtn.disabled = true;

        updateBtn.innerHTML =
          '<span class="spinner"></span>Updating...';


        try {

          const {
            data: {
              session
            }
          } = await supabase.auth.getSession();


          if (!session) {

            throw new Error(
              "This password reset session is invalid or has expired. Please request a new reset link."
            );

          }


          const {
            error
          } = await supabase.auth.updateUser({
            password
          });


          if (error) {
            throw error;
          }


          showMessage(
            "Password updated successfully. Redirecting to login...",
            "success"
          );


          updateForm.reset();

          updateStrength();


          /*
           * Sign out after password change.
           * The user can then login using the new password.
           */

          await supabase.auth.signOut();


          setTimeout(() => {

            window.location.replace(
              "login.html"
            );

          }, 1800);


        } catch (error) {

          console.error(
            "Update password error:",
            error
          );


          showMessage(
            getFriendlyError(error),
            "error"
          );


          updateBtn.disabled = false;

          updateBtn.textContent =
            "Update Password";

        }

      }
    );

  </script></body>
  </html>
